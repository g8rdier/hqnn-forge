name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ruff and mypy are configured in pyproject.toml but were never enforced. One
  # interpreter is enough: the rule set depends on the pinned ruff version, not
  # on the interpreter, and [tool.mypy] fixes python_version = "3.12" itself.
  # The tools come from uv.lock so a ruff release cannot change the rule set
  # under an open PR; Dependabot bumps them like every other dev dependency.
  # mypy covers the package only: tests/ has its own baseline to fix first.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies from the lockfile
      run: uv sync --locked --extra dev

    - name: Lint
      run: uv run --frozen ruff check hqnn_forge tests examples

    - name: Check formatting
      run: uv run --frozen ruff format --check hqnn_forge tests examples

    - name: Type-check
      run: uv run --frozen mypy hqnn_forge

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,lightning]"
        
    - name: Run pytest
      run: |
        pytest tests/ -v

  # The matrix above installs the latest versions satisfying the open ">=" floors,
  # which is the early warning that an upstream release broke us. This job installs
  # the exact resolution recorded in uv.lock instead, so a Dependabot lockfile bump
  # is tested against the versions it actually changes. --locked additionally fails
  # if uv.lock has drifted out of sync with pyproject.toml.
  #
  # Both interpreters are run because uv.lock resolves per interpreter: the core
  # stack carries python_full_version markers, so the oldest supported version and
  # the newest can install different pins from the same lockfile. A job on one
  # interpreter only would go green without installing the other half of a bump.
  test-locked:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies from the lockfile
      run: uv sync --locked --all-extras

    - name: Run pytest
      run: uv run --frozen pytest tests/ -v
