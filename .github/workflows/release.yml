name: Release

# Publishes a tagged version to PyPI and creates the GitHub release (#321).
#
#   git tag v0.1.0 <merge commit of the release PR> && git push origin v0.1.0
#
# The tag must equal "v" + project.version, and CHANGELOG.md must have a
# non-empty "## [0.1.0]" section; .github/scripts/release_notes.py checks both
# before anything is built.  Publishing uses PyPI trusted publishing (OIDC), so
# no token is stored in the repository.  It needs a one-time setup on PyPI and
# TestPyPI -- a trusted publisher for this repository, workflow release.yml and
# environment "pypi" / "testpypi" -- and the two environments in the
# repository settings.
#
# A manual run (workflow_dispatch) is a dry run: it builds the current commit
# and uploads it to TestPyPI only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: "3.12"
    - name: Check the tag against pyproject.toml and CHANGELOG.md
      if: github.event_name == 'push'
      run: python .github/scripts/release_notes.py check "$GITHUB_REF_NAME"
    - name: Build the sdist and wheel
      run: uv build
    - name: Check the distributions' metadata
      run: uvx twine check --strict dist/*
    - name: Check the wheel installs, imports and reports project.version
      run: |
        uv venv /tmp/wheel-check
        uv pip install --python /tmp/wheel-check dist/*.whl
        expected=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        # From outside the checkout, so the wheel is imported, not ./hqnn_forge.
        cd /tmp
        /tmp/wheel-check/bin/python -c "import hqnn_forge, hqnn_forge.models, hqnn_forge.encoding; v = hqnn_forge.__version__; assert v == '$expected', (v, '$expected'); print(v)"
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish-pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hqnn-forge/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Create the GitHub release from the changelog section
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python .github/scripts/release_notes.py notes "$GITHUB_REF_NAME" > notes.md
        prerelease=""
        if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
        gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
          --notes-file notes.md $prerelease

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hqnn-forge/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        # A second dry run of the same version must not fail on the upload.
        skip-existing: true
