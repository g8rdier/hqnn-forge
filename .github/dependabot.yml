version: 2
updates:
  # Tracks uv.lock only. Dependabot's uv ecosystem updates the lockfile without
  # rewriting the constraints in pyproject.toml, which is deliberate: the runtime
  # floors there are open (">=") and raised by hand when a version actually breaks.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"

  # Keeps the actions in tests.yml current; without this entry checkout,
  # setup-python and setup-uv would never be updated. The three arrive in one
  # grouped PR rather than three: they are reviewed identically and each
  # ungrouped PR would spend a full matrix run to say the same thing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
