site_name: hqnn-forge
site_description: Hybrid quantum-classical neural networks for tabular classification
repo_url: https://github.com/g8rdier/hqnn-forge
repo_name: g8rdier/hqnn-forge
edit_uri: edit/main/docs/
# Every warning -- an unresolved cross-reference, a missing page -- fails
# `mkdocs build --strict`, which CI runs (#322).
strict: true
# The griffe extension and its tests live beside the pages but are not pages.
exclude_docs: |
  *.py
  __pycache__/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            extensions:
              - docs/griffe_sphinx_roles.py:SphinxRoles
            members_order: source
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
            show_submodules: false
            heading_level: 2

nav:
  - Home: index.md
  - API reference:
      - Encoding layers: api/encoding.md
      - Models: api/models.md
      - Noise: api/noise.md
      - Quantum kernels: api/kernels.md
      - Diagnostics: api/diagnostics.md
      - Evaluation: api/evaluation.md
      - Evaluation plots: api/evaluation.plots.md
      - Training: api/training.md
      - Data: api/data.md
      - Preprocessing: api/preprocessing.md
      - scikit-learn estimator: api/sklearn.md
      - Utilities: api/utils.md
      - Circuit primitives: api/circuits.md
      - Initialisers: api/initializers.md
