[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqnn-forge"
version = "0.1.0"
description = "Parameter-efficient Hybrid Quantum Neural Networks for imbalanced tabular classification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HQNN-Forge Contributors" }]
keywords = [
    "quantum machine learning",
    "hybrid quantum neural network",
    "PennyLane",
    "PyTorch",
    "NISQ",
    "fraud detection",
    "imbalanced classification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "torch>=2.2",
    # floor is the lowest CI-tested version; 0.38 breaks with autoray>=0.7
    # (NumpyMimic removed) and PennyLane declares no upper bound of its own
    "pennylane>=0.45",
    "numpy>=1.26",
]

[project.optional-dependencies]
lightning = [
    "pennylane-lightning>=0.45",  # enables adjoint diff on CPU
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]
examples = [
    "scikit-learn",   # only used for synthetic dataset generation in examples
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hqnn_forge*"]

[tool.setuptools.package-data]
hqnn_forge = ["py.typed"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # `import torch.nn as nn` / `import torch.optim as optim` is the PyTorch
    # idiom used throughout; `from torch import nn` reads as a different thing
    "PLR0402",
    # class-level constants in tests are read-only fixtures, not shared state
    "RUF012",
    # PCANormalizer.fit rejects a bool n_components with ValueError on purpose:
    # bool is an int subclass, so it is a value check, not a type check
    "TRY004",
]

[tool.mypy]
# 3.12, not the 3.11 floor: the numpy stubs use the PEP 695 `type` statement,
# which mypy only accepts at a target of 3.12 or later (see #102)
python_version = "3.12"
ignore_missing_imports = true
strict = false
