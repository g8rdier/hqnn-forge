[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqnn-forge"
version = "0.1.0"
description = "Parameter-efficient Hybrid Quantum Neural Networks for imbalanced tabular classification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HQNN-Forge Contributors" }]
keywords = [
    "quantum machine learning",
    "hybrid quantum neural network",
    "PennyLane",
    "PyTorch",
    "NISQ",
    "fraud detection",
    "imbalanced classification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "torch>=2.2",
    # floor is the lowest CI-tested version; 0.38 breaks with autoray>=0.7
    # (NumpyMimic removed) and PennyLane declares no upper bound of its own
    "pennylane>=0.45",
    "numpy>=1.26",
]

[project.optional-dependencies]
lightning = [
    "pennylane-lightning>=0.45",  # enables adjoint diff on CPU
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
sklearn = [
    # hqnn_forge.sklearn needs validate_data and __sklearn_tags__, both new in 1.6
    "scikit-learn>=1.6",
]
examples = [
    "scikit-learn>=1.6",  # dataset generation in examples, and hqnn_forge.sklearn
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hqnn_forge*"]

[tool.setuptools.package-data]
hqnn_forge = ["py.typed"]

# ruff is the only formatter and linter; black is deliberately not declared,
# so there is one line length (99) and one formatting style (see #133)
[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # `import torch.nn as nn` / `import torch.optim as optim` is the PyTorch
    # idiom used throughout; `from torch import nn` reads as a different thing
    "PLR0402",
    # `dict(key=value)` for config dicts reads like the keyword arguments
    # it records or forwards
    "C408",
    # int(round(x)) is kept on purpose: round() of a numpy scalar is not
    # guaranteed to return a Python int
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # class-level constants in tests are read-only fixtures, not shared state
    "RUF012",
    # nesting pytest.raises around a context manager shows which statement is
    # expected to raise
    "SIM117",
]

[tool.mypy]
# 3.12, not the 3.11 floor: the numpy stubs use the PEP 695 `type` statement,
# which mypy only accepts at a target of 3.12 or later (see #102)
python_version = "3.12"
ignore_missing_imports = true
strict = false
